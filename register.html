<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Registration - MediCare AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #2674e8;
        }

        header a {
            text-decoration: none;
            color: #2674e8;
            font-weight: bold;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            border: 1px solid #e3e7ed;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #687386;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd3dd;
            border-radius: 8px;
            font-size: 15px;
        }

        .button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2674e8;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #registrationResult {
            margin-top: 20px;
            padding: 15px;
            background: #f1f5fa;
            border-radius: 8px;
            line-height: 1.6;
        }

        footer {
            margin-top: 60px;
            background: #172033;
            color: white;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        MediCare <span>AI</span>
    </div>

    <a href="index.html">Back to Home</a>

</header>


<div class="container">

    <h1>Patient Registration</h1>

    <p class="description">
        Register your details to access MediCare AI hospital services.
    </p>


    <form onsubmit="registerPatient(event)">

        <label>Full Name</label>
        <input
            type="text"
            id="fullName"
            placeholder="Enter your full name">

        <label>Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email">

        <label>Phone Number</label>
        <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number">

        <label>Age</label>
        <input
            type="number"
            id="age"
            placeholder="Enter your age">

        <label>Gender</label>

        <select id="gender">

            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>

        </select>


        <button class="button" type="submit">
            Register Patient
        </button>

    </form>


    <div id="registrationResult">
        Registration status will appear here.
    </div>

</div>


<footer>
    © 2026 MediCare AI | Smart Hospital Assistant
</footer>


<script>

function registerPatient(event) {

    event.preventDefault();

    let name =
        document.getElementById("fullName").value;

    let email =
        document.getElementById("email").value;

    let phone =
        document.getElementById("phone").value;

    let age =
        document.getElementById("age").value;

    let gender =
        document.getElementById("gender").value;

    let result =
        document.getElementById("registrationResult");


    if (
        name === "" ||
        email === "" ||
        phone === "" ||
        age === "" ||
        gender === ""
    ) {

        result.innerHTML =
            "Please fill in all registration details.";

        return;
    }


    result.innerHTML =
        "<b>Registration Successful!</b><br>" +
        "Patient Name: " + name + "<br>" +
        "Email: " + email + "<br>" +
        "Phone: " + phone + "<br>" +
        "Your patient registration has been submitted successfully.";

}

</script>

</body>
</html>
